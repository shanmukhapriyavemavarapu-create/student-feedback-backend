<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Feedback System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
        }

        header {
            background: #234a84;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: 35px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        h2 {
            text-align: center;
            color: #234a84;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
        }

        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #234a84;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #16335e;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Student Feedback Management System</h1>
        <p>We value your feedback!</p>
    </header>

    <div class="container">
        <h2>Feedback Form</h2>

        <form id="feedbackForm">
            <label for="name">Student Name</label>
            <input type="text" id="name" required maxlength="100"
                   placeholder="Enter your name">

            <label for="course">Course / Department</label>
            <input type="text" id="course" required maxlength="100"
                   placeholder="Enter your course">

            <label for="rating">Rating</label>
            <select id="rating" required>
                <option value="">Select rating</option>
                <option value="5">5 - Excellent</option>
                <option value="4">4 - Very Good</option>
                <option value="3">3 - Good</option>
                <option value="2">2 - Fair</option>
                <option value="1">1 - Poor</option>
            </select>

            <label for="comments">Comments</label>
            <textarea id="comments" rows="4" maxlength="1000"
                      required placeholder="Write your feedback"></textarea>

            <button type="submit">Submit Feedback</button>
        </form>

        <p id="message"></p>
    </div>

    <script>
        const form = document.getElementById("feedbackForm");
        const message = document.getElementById("message");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const feedback = {
                studentName: document.getElementById("name").value.trim(),
                course: document.getElementById("course").value.trim(),
                rating: Number(document.getElementById("rating").value),
                comments: document.getElementById("comments").value.trim()
            };

            try {
                const response = await fetch("/api/feedback", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify(feedback)
                });

                if (!response.ok) {
                    throw new Error("Submission failed");
                }

                message.textContent = "Feedback submitted successfully!";
                message.style.color = "green";
                form.reset();
            } catch (error) {
                message.textContent =
                    "Could not submit feedback. Please check that the application is running.";
                message.style.color = "red";
            }
        });
    </script>

</body>
</html>
